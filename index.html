<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Random Meme</title>

	<style>
		body {
			margin: 0;
			background: #222;
			color: white;
			font-family: Arial, sans-serif;
			text-align: center;
		}

		h1 {
			margin-top: 30px;
		}

		#randomButton {
			font-size: 24px;
			padding: 15px 30px;
			margin: 20px;
			cursor: pointer;
		}

		#memeName {
			font-size: 20px;
			margin: 10px;
		}

		#loading {
			display: none;
			font-size: 20px;
		}

		#editor {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			align-items: flex-start;
			gap: 30px;
			margin: 20px;
		}

		#canvasContainer {
			position: relative;
			width: fit-content;
			max-width: 70vw;
		}

		#memeCanvas {
			display: block;
			max-width: 70vw;
			max-height: 70vh;
			background: black;
			cursor: crosshair;
			touch-action: none;
		}

		#controls {
			width: 300px;
			max-width: 90vw;
			text-align: left;
		}

		#globalControls {
			background: #333;
			padding: 15px;
			margin-bottom: 15px;
			border-radius: 8px;
		}

		#globalControls label {
			cursor: pointer;
			font-size: 16px;
		}

		.textBoxControls {
			background: #333;
			padding: 15px;
			margin-bottom: 15px;
			border-radius: 8px;
		}

		.textBoxControls h3 {
			margin-top: 0;
		}

		.textBoxControls label {
			display: block;
			margin-top: 8px;
		}

		.textBoxControls input[type="text"] {
			width: 100%;
			box-sizing: border-box;
			padding: 8px;
			font-size: 16px;
		}

		.numberInput {
			width: 80px;
			padding: 6px;
			font-size: 16px;
		}

		.resetButton {
			margin-top: 10px;
			padding: 6px 12px;
			cursor: pointer;
		}

		#instructions {
			margin: 10px auto 20px auto;
			max-width: 700px;
			color: #bbb;
		}
	</style>
</head>

<body>

	<h1>RANDOM MEME GENERATOR</h1>

	<button id="randomButton">
		RANDOM MEME
	</button>

	<div id="loading">
		Loading...
	</div>

	<div id="memeName">
		Click the button.
	</div>

	<div id="instructions">
		Drag the text directly on the meme to move it.
		Use the controls to change the exact position and size.
	</div>

	<div id="editor">

		<div id="canvasContainer">
			<canvas id="memeCanvas"></canvas>
		</div>

		<div id="controls">
		</div>

	</div>

	<script>

		const randomButton = document.getElementById("randomButton");
		const memeCanvas = document.getElementById("memeCanvas");
		const memeName = document.getElementById("memeName");
		const loading = document.getElementById("loading");
		const controls = document.getElementById("controls");

		const ctx = memeCanvas.getContext("2d");


		// ============================================================
		// VARIABLES
		// ============================================================

		let memes = [];

		let currentMeme = null;

		let currentImage = null;

		let textBoxes = [];

		let draggingBox = null;

		let dragOffsetX = 0;

		let dragOffsetY = 0;

		let hideWhiteBar = false;


		// ============================================================
		// LOAD MEMES
		// ============================================================

		async function loadMemes() {

			try {

				loading.style.display = "block";

				const response = await fetch(
					"https://api.imgflip.com/get_memes?type=image"
				);

				const data = await response.json();

				if (!data.success) {
					throw new Error("Failed to get memes.");
				}

				memes = data.data.memes;

				loading.style.display = "none";

				console.log(
					"Loaded memes:",
					memes.length
				);

				getRandomMeme();

			} catch (error) {

				console.error(error);

				loading.innerText =
					"Failed to load memes.";

				loading.style.display = "block";
			}
		}


		// ============================================================
		// RANDOM MEME
		// ============================================================

		function getRandomMeme() {

			if (memes.length === 0) {
				return;
			}

			const randomIndex = Math.floor(
				Math.random() * memes.length
			);

			currentMeme = memes[randomIndex];

			memeName.innerText =
				currentMeme.name;

			createControls();

			loadMemeImage();
		}


		// ============================================================
		// CREATE ALL CONTROLS
		// ============================================================

		function createControls() {

			controls.innerHTML = "";

			textBoxes = [];


			// ========================================================
			// GLOBAL CONTROLS
			// ========================================================

			const globalControls =
				document.createElement("div");

			globalControls.id =
				"globalControls";


			const whiteBarLabel =
				document.createElement("label");


			const whiteBarCheckbox =
				document.createElement("input");

			whiteBarCheckbox.type =
				"checkbox";

			whiteBarCheckbox.checked =
				hideWhiteBar;


			whiteBarCheckbox.addEventListener(
				"change",
				function() {

					hideWhiteBar =
						whiteBarCheckbox.checked;

					drawMeme();
				}
			);


			whiteBarLabel.appendChild(
				whiteBarCheckbox
			);

			whiteBarLabel.appendChild(
				document.createTextNode(
					" Hide top white bar"
				)
			);


			globalControls.appendChild(
				whiteBarLabel
			);

			controls.appendChild(
				globalControls
			);


			// ========================================================
			// TEXT BOXES
			// ========================================================

			const boxCount =
				currentMeme.box_count || 2;


			for (let i = 0; i < boxCount; i++) {

				const box = {

					text: "",

					x: 50,

					y: 50,

					size: 7.5,

					index: i
				};


				if (boxCount === 2) {

					if (i === 0) {
						box.y = 10;
					} else {
						box.y = 90;
					}

				} else {

					box.y =
						10 +
						(80 / Math.max(
							1,
							boxCount - 1
						)) * i;
				}


				textBoxes.push(box);

				createTextBoxControls(box);
			}
		}


		// ============================================================
		// CREATE TEXT BOX CONTROLS
		// ============================================================

		function createTextBoxControls(box) {

			const container =
				document.createElement("div");

			container.className =
				"textBoxControls";


			const title =
				document.createElement("h3");

			title.innerText =
				"Text Box " + (box.index + 1);

			container.appendChild(title);


			// ========================================================
			// TEXT
			// ========================================================

			const textLabel =
				document.createElement("label");

			textLabel.innerText =
				"Text";

			container.appendChild(textLabel);


			const textInput =
				document.createElement("input");

			textInput.type =
				"text";

			textInput.placeholder =
				getPlaceholder(
					box.index,
					currentMeme.box_count
				);

			textInput.value =
				box.text;

			textInput.addEventListener(
				"input",
				function() {

					box.text =
						textInput.value;

					drawMeme();
				}
			);

			container.appendChild(textInput);


			// ========================================================
			// X POSITION
			// ========================================================

			const xLabel =
				document.createElement("label");

			xLabel.innerText =
				"X Position (%)";

			container.appendChild(xLabel);


			const xInput =
				document.createElement("input");

			xInput.type =
				"number";

			xInput.className =
				"numberInput";

			xInput.min = 0;

			xInput.max = 100;

			xInput.step = 0.1;

			xInput.value =
				box.x;

			xInput.addEventListener(
				"input",
				function() {

					box.x =
						clamp(
							parseFloat(
								xInput.value
							) || 0,
							0,
							100
						);

					drawMeme();
				}
			);

			container.appendChild(xInput);


			// ========================================================
			// Y POSITION
			// ========================================================

			const yLabel =
				document.createElement("label");

			yLabel.innerText =
				"Y Position (%)";

			container.appendChild(yLabel);


			const yInput =
				document.createElement("input");

			yInput.type =
				"number";

			yInput.className =
				"numberInput";

			yInput.min = 0;

			yInput.max = 100;

			yInput.step = 0.1;

			yInput.value =
				box.y;

			yInput.addEventListener(
				"input",
				function() {

					box.y =
						clamp(
							parseFloat(
								yInput.value
							) || 0,
							0,
							100
						);

					drawMeme();
				}
			);

			container.appendChild(yInput);


			// ========================================================
			// FONT SIZE
			// ========================================================

			const sizeLabel =
				document.createElement("label");

			sizeLabel.innerText =
				"Font Size (%)";

			container.appendChild(sizeLabel);


			const sizeInput =
				document.createElement("input");

			sizeInput.type =
				"number";

			sizeInput.className =
				"numberInput";

			sizeInput.min = 1;

			sizeInput.max = 30;

			sizeInput.step = 0.1;

			sizeInput.value =
				box.size;

			sizeInput.addEventListener(
				"input",
				function() {

					box.size =
						clamp(
							parseFloat(
								sizeInput.value
							) || 1,
							1,
							30
						);

					drawMeme();
				}
			);

			container.appendChild(sizeInput);


			// ========================================================
			// RESET
			// ========================================================

			const resetButton =
				document.createElement("button");

			resetButton.className =
				"resetButton";

			resetButton.innerText =
				"Reset Position";


			resetButton.addEventListener(
				"click",
				function() {

					box.x = 50;


					if (
						currentMeme.box_count === 2
					) {

						if (box.index === 0) {
							box.y = 10;
						} else {
							box.y = 90;
						}

					} else {

						box.y =
							10 +
							(
								80 /
								Math.max(
									1,
									currentMeme.box_count - 1
								)
							) *
							box.index;
					}


					xInput.value =
						box.x;

					yInput.value =
						box.y;


					drawMeme();
				}
			);


			container.appendChild(
				resetButton
			);

			controls.appendChild(
				container
			);


			// Store input references
			box.xInput =
				xInput;

			box.yInput =
				yInput;

			box.sizeInput =
				sizeInput;
		}


		// ============================================================
		// PLACEHOLDER
		// ============================================================

		function getPlaceholder(
			index,
			boxCount
		) {

			if (boxCount === 1) {
				return "Meme text...";
			}

			if (index === 0) {
				return "Top text...";
			}

			if (index === 1) {
				return "Bottom text...";
			}

			return "Text " +
				(index + 1) +
				"...";
		}


		// ============================================================
		// LOAD IMAGE
		// ============================================================

		function loadMemeImage() {

			currentImage =
				new Image();

			currentImage.crossOrigin =
				"anonymous";


			currentImage.onload =
				function() {

					memeCanvas.width =
						currentImage.naturalWidth;

					memeCanvas.height =
						currentImage.naturalHeight;

					drawMeme();
				};


			currentImage.onerror =
				function() {

					console.error(
						"Failed to load meme image."
					);
				};


			currentImage.src =
				currentMeme.url;
		}


		// ============================================================
		// DRAW MEME
		// ============================================================

		function drawMeme() {

			if (
				!currentImage ||
				!currentImage.complete
			) {
				return;
			}


			ctx.clearRect(
				0,
				0,
				memeCanvas.width,
				memeCanvas.height
			);


			// ========================================================
			// DRAW ORIGINAL IMAGE
			// ========================================================

			ctx.drawImage(
				currentImage,
				0,
				0,
				memeCanvas.width,
				memeCanvas.height
			);


			// ========================================================
			// HIDE TOP WHITE BAR
			// ========================================================

			if (hideWhiteBar) {

				/*
				 * Covers the top portion of the image.
				 *
				 * Change this value if the white bar
				 * on your templates is taller/shorter.
				 */

				const whiteBarHeight =
					memeCanvas.height * 0.12;


				/*
				 * Use the color from the area
				 * immediately below the bar.
				 *
				 * This works better than always
				 * using white.
				 */

				const sampleY =
					Math.min(
						whiteBarHeight + 2,
						memeCanvas.height - 1
					);


				const pixel =
					ctx.getImageData(
						Math.floor(
							memeCanvas.width / 2
						),
						sampleY,
						1,
						1
					).data;


				ctx.fillStyle =
					"rgb(" +
					pixel[0] +
					"," +
					pixel[1] +
					"," +
					pixel[2] +
					")";


				ctx.fillRect(
					0,
					0,
					memeCanvas.width,
					whiteBarHeight
				);
			}


			// ========================================================
			// DRAW TEXT
			// ========================================================

			for (const box of textBoxes) {

				if (
					box.text.trim() === ""
				) {
					continue;
				}


				const x =
					memeCanvas.width *
					(box.x / 100);


				const y =
					memeCanvas.height *
					(box.y / 100);


				const fontSize =
					memeCanvas.width *
					(box.size / 100);


				ctx.font =
					"bold " +
					fontSize +
					"px Impact, Arial Black, sans-serif";


				ctx.textAlign =
					"center";

				ctx.textBaseline =
					"middle";

				ctx.fillStyle =
					"white";

				ctx.strokeStyle =
					"black";

				ctx.lineWidth =
					Math.max(
						3,
						fontSize * 0.08
					);

				ctx.lineJoin =
					"round";


				drawText(
					box.text,
					x,
					y,
					fontSize
				);
			}


			drawTextHandles();
		}


		// ============================================================
		// DRAW TEXT
		// ============================================================

		function drawText(
			text,
			x,
			y,
			fontSize
		) {

			const maxWidth =
				memeCanvas.width * 0.9;

			const lines =
				wrapText(
					text,
					maxWidth
				);


			const lineHeight =
				fontSize * 1.05;


			const totalHeight =
				lines.length *
				lineHeight;


			let startY =
				y -
				totalHeight / 2 +
				lineHeight / 2;


			for (const line of lines) {

				ctx.strokeText(
					line,
					x,
					startY
				);

				ctx.fillText(
					line,
					x,
					startY
				);

				startY +=
					lineHeight;
			}
		}


		// ============================================================
		// WRAP TEXT
		// ============================================================

		function wrapText(
			text,
			maxWidth
		) {

			const words =
				text.split(" ");

			const lines = [];

			let currentLine = "";


			for (const word of words) {

				const testLine =
					currentLine === ""
						? word
						: currentLine +
							" " +
							word;


				const width =
					ctx.measureText(
						testLine
					).width;


				if (
					width > maxWidth &&
					currentLine !== ""
				) {

					lines.push(
						currentLine
					);

					currentLine =
						word;

				} else {

					currentLine =
						testLine;
				}
			}


			if (currentLine !== "") {

				lines.push(
					currentLine
				);
			}


			return lines;
		}


		// ============================================================
		// DRAW HANDLES
		// ============================================================

		function drawTextHandles() {

			for (const box of textBoxes) {

				if (
					box.text.trim() === ""
				) {
					continue;
				}


				const x =
					memeCanvas.width *
					(box.x / 100);


				const y =
					memeCanvas.height *
					(box.y / 100);


				const fontSize =
					memeCanvas.width *
					(box.size / 100);


				ctx.font =
					"bold " +
					fontSize +
					"px Impact, Arial Black, sans-serif";


				const textWidth =
					Math.min(
						ctx.measureText(
							box.text
						).width,
						memeCanvas.width * 0.9
					);


				const handleWidth =
					Math.max(
						60,
						textWidth + 20
					);


				const handleHeight =
					fontSize + 20;


				ctx.strokeStyle =
					"rgba(255,255,255,0.6)";

				ctx.lineWidth = 2;

				ctx.setLineDash([
					6,
					4
				]);


				ctx.strokeRect(
					x -
						handleWidth / 2,
					y -
						handleHeight / 2,
					handleWidth,
					handleHeight
				);


				ctx.setLineDash([]);
			}
		}


		// ============================================================
		// FIND BOX UNDER MOUSE
		// ============================================================

		function getBoxAtPosition(
			mouseX,
			mouseY
		) {

			for (
				let i =
					textBoxes.length - 1;
				i >= 0;
				i--
			) {

				const box =
					textBoxes[i];


				if (
					box.text.trim() === ""
				) {
					continue;
				}


				const x =
					memeCanvas.width *
					(box.x / 100);


				const y =
					memeCanvas.height *
					(box.y / 100);


				const fontSize =
					memeCanvas.width *
					(box.size / 100);


				ctx.font =
					"bold " +
					fontSize +
					"px Impact, Arial Black, sans-serif";


				const textWidth =
					Math.min(
						ctx.measureText(
							box.text
						).width,
						memeCanvas.width * 0.9
					);


				const boxWidth =
					Math.max(
						60,
						textWidth + 30
					);


				const boxHeight =
					fontSize + 30;


				if (
					mouseX >=
						x -
						boxWidth / 2 &&
					mouseX <=
						x +
						boxWidth / 2 &&
					mouseY >=
						y -
						boxHeight / 2 &&
					mouseY <=
						y +
						boxHeight / 2
				) {

					return box;
				}
			}


			return null;
		}


		// ============================================================
		// MOUSE DOWN
		// ============================================================

		memeCanvas.addEventListener(
			"mousedown",
			function(event) {

				const position =
					getMousePosition(
						event
					);


				const box =
					getBoxAtPosition(
						position.x,
						position.y
					);


				if (!box) {
					return;
				}


				draggingBox =
					box;


				dragOffsetX =
					position.x -
					memeCanvas.width *
					(box.x / 100);


				dragOffsetY =
					position.y -
					memeCanvas.height *
					(box.y / 100);
			}
		);


		// ============================================================
		// MOUSE MOVE
		// ============================================================

		memeCanvas.addEventListener(
			"mousemove",
			function(event) {

				if (!draggingBox) {
					return;
				}


				const position =
					getMousePosition(
						event
					);


				const newX =
					position.x -
					dragOffsetX;


				const newY =
					position.y -
					dragOffsetY;


				draggingBox.x =
					clamp(
						newX /
							memeCanvas.width *
							100,
						0,
						100
					);


				draggingBox.y =
					clamp(
						newY /
							memeCanvas.height *
							100,
						0,
						100
					);


				draggingBox.xInput.value =
					draggingBox.x.toFixed(
						1
					);


				draggingBox.yInput.value =
					draggingBox.y.toFixed(
						1
					);


				drawMeme();
			}
		);


		// ============================================================
		// MOUSE UP
		// ============================================================

		document.addEventListener(
			"mouseup",
			function() {

				draggingBox = null;
			}
		);


		// ============================================================
		// TOUCH START
		// ============================================================

		memeCanvas.addEventListener(
			"touchstart",
			function(event) {

				event.preventDefault();


				const touch =
					event.touches[0];


				const position =
					getTouchPosition(
						touch
					);


				const box =
					getBoxAtPosition(
						position.x,
						position.y
					);


				if (!box) {
					return;
				}


				draggingBox =
					box;


				dragOffsetX =
					position.x -
					memeCanvas.width *
					(box.x / 100);


				dragOffsetY =
					position.y -
					memeCanvas.height *
					(box.y / 100);
			},
			{
				passive: false
			}
		);


		// ============================================================
		// TOUCH MOVE
		// ============================================================

		memeCanvas.addEventListener(
			"touchmove",
			function(event) {

				event.preventDefault();


				if (!draggingBox) {
					return;
				}


				const touch =
					event.touches[0];


				const position =
					getTouchPosition(
						touch
					);


				const newX =
					position.x -
					dragOffsetX;


				const newY =
					position.y -
					dragOffsetY;


				draggingBox.x =
					clamp(
						newX /
							memeCanvas.width *
							100,
						0,
						100
					);


				draggingBox.y =
					clamp(
						newY /
							memeCanvas.height *
							100,
						0,
						100
					);


				draggingBox.xInput.value =
					draggingBox.x.toFixed(
						1
					);


				draggingBox.yInput.value =
					draggingBox.y.toFixed(
						1
					);


				drawMeme();
			},
			{
				passive: false
			}
		);


		// ============================================================
		// TOUCH END
		// ============================================================

		memeCanvas.addEventListener(
			"touchend",
			function() {

				draggingBox = null;
			}
		);


		// ============================================================
		// MOUSE POSITION
		// ============================================================

		function getMousePosition(
			event
		) {

			const rect =
				memeCanvas.getBoundingClientRect();


			const scaleX =
				memeCanvas.width /
				rect.width;


			const scaleY =
				memeCanvas.height /
				rect.height;


			return {

				x:
					(event.clientX -
						rect.left) *
					scaleX,

				y:
					(event.clientY -
						rect.top) *
					scaleY
			};
		}


		// ============================================================
		// TOUCH POSITION
		// ============================================================

		function getTouchPosition(
			touch
		) {

			const rect =
				memeCanvas.getBoundingClientRect();


			const scaleX =
				memeCanvas.width /
				rect.width;


			const scaleY =
				memeCanvas.height /
				rect.height;


			return {

				x:
					(touch.clientX -
						rect.left) *
					scaleX,

				y:
					(touch.clientY -
						rect.top) *
					scaleY
			};
		}


		// ============================================================
		// CLAMP
		// ============================================================

		function clamp(
			value,
			min,
			max
		) {

			return Math.min(
				Math.max(
					value,
					min
				),
				max
			);
		}


		// ============================================================
		// RANDOM BUTTON
		// ============================================================

		randomButton.addEventListener(
			"click",
			getRandomMeme
		);


		// ============================================================
		// START
		// ============================================================

		loadMemes();

	</script>

</body>
