<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Random Meme</title>

	<style>
		body {
			margin: 0;
			background: #222;
			color: white;
			font-family: Arial, sans-serif;
			text-align: center;
		}

		h1 {
			margin-top: 30px;
		}

		#randomButton {
			font-size: 24px;
			padding: 15px 30px;
			margin: 20px;
			cursor: pointer;
		}

		#memeName {
			font-size: 20px;
			margin: 10px;
		}

		#memeImage {
			display: block;
			max-width: 90%;
			max-height: 70vh;
			margin: 20px auto;
		}

		#loading {
			display: none;
			font-size: 20px;
		}
	</style>
</head>

<body>

	<h1>RANDOM MEME GENERATOR</h1>

	<button id="randomButton">
		RANDOM MEME
	</button>

	<div id="loading">
		Loading...
	</div>

	<div id="memeName">
		Click the button.
	</div>

	<img id="memeImage" src="" alt="Random meme template">

	<script>
		const randomButton = document.getElementById("randomButton");
		const memeImage = document.getElementById("memeImage");
		const memeName = document.getElementById("memeName");
		const loading = document.getElementById("loading");

		let memes = [];

		async function loadMemes() {
			try {
				loading.style.display = "block";

				const response = await fetch(
					"https://api.imgflip.com/get_memes?type=image"
				);

				const data = await response.json();

				if (!data.success) {
					throw new Error("Failed to get memes.");
				}

				memes = data.data.memes;

				loading.style.display = "none";

				console.log("Loaded memes:", memes.length);

			} catch (error) {
				console.error(error);

				loading.innerText = "Failed to load memes.";
			}
		}

		function getRandomMeme() {
			if (memes.length === 0) {
				return;
			}

			const randomIndex = Math.floor(
				Math.random() * memes.length
			);

			const meme = memes[randomIndex];

			memeImage.src = meme.url;
			memeName.innerText = meme.name;
		}

		randomButton.addEventListener("click", getRandomMeme);

		loadMemes();
	</script>

</body>
</html>
