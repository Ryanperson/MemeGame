<!DOCTYPE html>

<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MakeItMeme</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
	* {
		box-sizing: border-box;
	}

	html,
	body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		background: #222;
		color: white;
		font-family: Arial, sans-serif;
	}

	body {
		overflow-x: hidden;
	}

	button,
	input {
		font-family: Arial, sans-serif;
	}

	button {
		cursor: pointer;
	}

	/* ============================================================
	   SCREENS
	   ============================================================ */

	.screen {
		display: none;
		width: 100%;
		min-height: 100vh;
	}

	.screen.active {
		display: flex;
	}

	/* ============================================================
	   MAIN MENU
	   ============================================================ */

	#mainMenu {
		align-items: center;
		justify-content: center;
		text-align: center;
	}

	#mainMenuContent {
		width: 420px;
		max-width: 90vw;
	}

	#mainMenuTitle {
		font-size: 64px;
		font-weight: 900;
		margin: 0 0 10px 0;
		letter-spacing: 2px;
	}

	#mainMenuSubtitle {
		color: #aaa;
		font-size: 18px;
		margin-bottom: 35px;
	}

	.menuPanel {
		background: #333;
		padding: 25px;
		border-radius: 12px;
		margin-bottom: 20px;
	}

	.menuPanel h2 {
		margin-top: 0;
	}

	.nameInput,
	.codeInput {
		width: 100%;
		padding: 14px;
		border: none;
		border-radius: 6px;
		font-size: 20px;
		text-align: center;
		margin-bottom: 12px;
		background: #eee;
		color: #222;
	}

	.primaryButton {
		width: 100%;
		padding: 15px;
		border: none;
		border-radius: 6px;
		background: #4caf50;
		color: white;
		font-size: 22px;
		font-weight: bold;
	}

	.primaryButton:hover {
		background: #45a049;
	}

	.secondaryButton {
		width: 100%;
		padding: 13px;
		border: none;
		border-radius: 6px;
		background: #555;
		color: white;
		font-size: 18px;
	}

	.secondaryButton:hover {
		background: #666;
	}

	.menuStatus {
		min-height: 24px;
		color: #ffcc66;
		margin-top: 12px;
	}

	/* ============================================================
	   LOBBY
	   ============================================================ */

	#lobbyScreen {
		align-items: center;
		justify-content: center;
		text-align: center;
	}

	#lobbyContent {
		width: 520px;
		max-width: 92vw;
	}

	#roomCode {
		font-size: 48px;
		font-weight: 900;
		letter-spacing: 8px;
		margin: 10px 0;
	}

	#roomCodeLabel {
		color: #aaa;
		font-size: 16px;
	}

	#hostStartButton {
		margin-top: 20px;
	}

	#hostStartButton:disabled {
		opacity: 0.5;
		cursor: not-allowed;
	}

	#playerList {
		text-align: left;
		margin-top: 20px;
	}

	.playerEntry {
		background: #444;
		padding: 12px 15px;
		border-radius: 6px;
		margin-bottom: 8px;
		font-size: 18px;
	}

	.hostTag {
		color: #ffd34d;
		font-size: 13px;
		font-weight: bold;
		margin-left: 8px;
	}

	/* ============================================================
	   EDITOR
	   ============================================================ */

	#editorScreen {
		display: none;
		flex-direction: column;
	}

	#editorScreen.active {
		display: flex;
	}

	#editorTopBar {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 25px;
		flex-wrap: wrap;
		padding: 14px 20px;
		background: #111;
		border-bottom: 1px solid #444;
	}

	#editorTimer {
		font-size: 30px;
		font-weight: bold;
	}

	#editorMemeName {
		color: #bbb;
		font-size: 18px;
	}

	#changeMemeButton {
		padding: 10px 16px;
		border: none;
		border-radius: 5px;
		background: #555;
		color: white;
		font-size: 16px;
	}

	#editor {
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
		align-items: flex-start;
		gap: 30px;
		margin: 20px;
		flex: 1;
	}

	#canvasContainer {
		position: relative;
		width: fit-content;
		max-width: 70vw;
	}

	#memeCanvas {
		display: block;
		max-width: 70vw;
		max-height: 75vh;
		background: black;
		cursor: crosshair;
		touch-action: none;
	}

	#controls {
		width: 300px;
		max-width: 90vw;
		text-align: left;
	}

	.textBoxControls {
		background: #333;
		padding: 15px;
		margin-bottom: 15px;
		border-radius: 8px;
	}

	.textBoxControls h3 {
		margin-top: 0;
	}

	.textBoxControls label {
		display: block;
		margin-top: 8px;
	}

	.textBoxControls input[type="text"] {
		width: 100%;
		box-sizing: border-box;
		padding: 8px;
		font-size: 16px;
	}

	.numberInput {
		width: 80px;
		padding: 6px;
		font-size: 16px;
	}

	.resetButton {
		margin-top: 10px;
		padding: 6px 12px;
		cursor: pointer;
	}

	#editorMessage {
		text-align: center;
		color: #aaa;
		padding: 10px;
	}

	/* ============================================================
	   SHOWCASE
	   ============================================================ */

	#showcaseScreen {
		display: none;
		align-items: center;
		justify-content: center;
		background: #000;
		min-height: 100vh;
	}

	#showcaseScreen.active {
		display: flex;
	}

	#showcaseContent {
		width: 100%;
		height: 100vh;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 25px;
	}

	#showcaseImage {
		display: block;
		max-width: 92vw;
		max-height: 78vh;
		object-fit: contain;
	}

	#voteButtons {
		display: flex;
		justify-content: center;
		align-items: center;
		gap: 18px;
	}

	.voteButton {
		width: 80px;
		height: 60px;
		border: none;
		border-radius: 12px;
		background: #222;
		color: white;
		font-size: 30px;
		transition: transform 0.1s, background 0.1s;
	}

	.voteButton:hover {
		background: #444;
		transform: scale(1.05);
	}

	.voteButton.selected {
		background: #666;
		transform: scale(1.08);
	}

	#showcaseStatus {
		position: absolute;
		bottom: 12px;
		color: #555;
		font-size: 12px;
		pointer-events: none;
	}
</style>


</head>

<body>


<!-- ============================================================
     MAIN MENU
     ============================================================ -->

<section id="mainMenu" class="screen active">
	<div id="mainMenuContent">

		<h1 id="mainMenuTitle">
			MAKEITMEME
		</h1>

		<div id="mainMenuSubtitle">
			Make memes. Compete. Vote.
		</div>

		<div class="menuPanel">

			<h2>
				Your Name
			</h2>

			<input
				id="nameInput"
				class="nameInput"
				type="text"
				maxlength="20"
				placeholder="Enter your name"
			>

		</div>

		<div class="menuPanel">

			<button
				id="hostLobbyButton"
				class="primaryButton"
			>
				HOST LOBBY
			</button>

		</div>

		<div class="menuPanel">

			<h2>
				Join Lobby
			</h2>

			<input
				id="joinCodeInput"
				class="codeInput"
				type="text"
				maxlength="6"
				placeholder="ROOM CODE"
			>

			<button
				id="joinLobbyButton"
				class="primaryButton"
			>
				JOIN LOBBY
			</button>

		</div>

		<div
			id="mainMenuStatus"
			class="menuStatus"
		></div>

	</div>
</section>


<!-- ============================================================
     LOBBY
     ============================================================ -->

<section id="lobbyScreen" class="screen">

	<div id="lobbyContent">

		<div class="menuPanel">

			<div id="roomCodeLabel">
				ROOM CODE
			</div>

			<div id="roomCode">
				------
			</div>

			<div id="lobbyStatus">
				Waiting for players...
			</div>

		</div>

		<div class="menuPanel">

			<h2>
				Players
			</h2>

			<div id="playerList">
			</div>

			<button
				id="hostStartButton"
				class="primaryButton"
			>
				START GAME
			</button>

			<button
				id="leaveLobbyButton"
				class="secondaryButton"
				style="margin-top: 10px;"
			>
				LEAVE LOBBY
			</button>

		</div>

	</div>

</section>


<!-- ============================================================
     EDITOR
     ============================================================ -->

<section id="editorScreen" class="screen">

	<div id="editorTopBar">

		<div id="editorTimer">
			60
		</div>

		<div id="editorMemeName">
			Loading meme...
		</div>

		<button id="changeMemeButton">
			CHANGE MEME
		</button>

	</div>

	<div id="editorMessage">
		Make your meme before the timer runs out.
	</div>

	<div id="editor">

		<div id="canvasContainer">
			<canvas id="memeCanvas"></canvas>
		</div>

		<div id="controls">
		</div>

	</div>

</section>


<!-- ============================================================
     SHOWCASE / VOTING
     ============================================================ -->

<section id="showcaseScreen" class="screen">

	<div id="showcaseContent">

		<img
			id="showcaseImage"
			alt="Meme"
		>

		<div id="voteButtons">

			<button
				class="voteButton"
				data-vote="up"
				title="Thumbs up"
			>
				👍
			</button>

			<button
				class="voteButton"
				data-vote="meh"
				title="Meh"
			>
				😐
			</button>

			<button
				class="voteButton"
				data-vote="down"
				title="Thumbs down"
			>
				👎
			</button>

		</div>

		<div id="showcaseStatus"></div>

	</div>

</section>


<script>

	// ============================================================
	// CONSTANTS
	// ============================================================

	const MAX_PLAYERS = 16;
	const ROUND_LENGTH = 60000;
	const SHOWCASE_LENGTH = 15000;
	const ROOM_PREFIX = "makeitmeme-";


	// ============================================================
	// DOM
	// ============================================================

	const mainMenu =
		document.getElementById("mainMenu");

	const lobbyScreen =
		document.getElementById("lobbyScreen");

	const editorScreen =
		document.getElementById("editorScreen");

	const showcaseScreen =
		document.getElementById("showcaseScreen");


	const nameInput =
		document.getElementById("nameInput");

	const joinCodeInput =
		document.getElementById("joinCodeInput");

	const hostLobbyButton =
		document.getElementById("hostLobbyButton");

	const joinLobbyButton =
		document.getElementById("joinLobbyButton");

	const mainMenuStatus =
		document.getElementById("mainMenuStatus");


	const roomCode =
		document.getElementById("roomCode");

	const lobbyStatus =
		document.getElementById("lobbyStatus");

	const playerList =
		document.getElementById("playerList");

	const hostStartButton =
		document.getElementById("hostStartButton");

	const leaveLobbyButton =
		document.getElementById("leaveLobbyButton");


	const editorTimer =
		document.getElementById("editorTimer");

	const editorMemeName =
		document.getElementById("editorMemeName");

	const editorMessage =
		document.getElementById("editorMessage");

	const changeMemeButton =
		document.getElementById("changeMemeButton");

	const memeCanvas =
		document.getElementById("memeCanvas");

	const controls =
		document.getElementById("controls");

	const showcaseImage =
		document.getElementById("showcaseImage");

	const voteButtons =
		document.querySelectorAll(".voteButton");

	const showcaseStatus =
		document.getElementById("showcaseStatus");


	const ctx =
		memeCanvas.getContext("2d");


	// ============================================================
	// NETWORK STATE
	// ============================================================

	let peer = null;
	let hostConnection = null;

	let isHost = false;

	let myPeerId = null;
	let myName = "";

	let roomCodeValue = "";

	let hostPeerId = null;

	let connections = new Map();

	let participants = [];

	let gameStarted = false;


	// ============================================================
	// ROUND STATE
	// ============================================================

	let roundStartTime = 0;
	let roundTimer = null;
	let roundSubmitted = false;

	let roundResults = {};


	// ============================================================
	// SHOWCASE STATE
	// ============================================================

	let showcaseItems = [];
	let showcaseStartedAt = 0;
	let showcaseTimer = null;
	let currentShowcaseIndex = -1;


	// ============================================================
	// MEME STATE
	// ============================================================

	let memes = [];

	let currentMeme = null;
	let currentImage = null;
	let textBoxes = [];

	let draggingBox = null;
	let dragOffsetX = 0;
	let dragOffsetY = 0;

	let imageLoadToken = 0;


	// ============================================================
	// SCREEN CONTROL
	// ============================================================

	function showScreen(screen) {

		mainMenu.classList.remove("active");
		lobbyScreen.classList.remove("active");
		editorScreen.classList.remove("active");
		showcaseScreen.classList.remove("active");

		screen.classList.add("active");
	}


	// ============================================================
	// STATUS
	// ============================================================

	function setMainMenuStatus(text) {

		mainMenuStatus.innerText = text;
	}


	// ============================================================
	// LOAD MEMES
	// ============================================================

	async function loadMemes() {

		try {

			const response =
				await fetch(
					"https://api.imgflip.com/get_memes?type=image"
				);

			const data =
				await response.json();

			if (!data.success) {
				throw new Error(
					"Failed to load memes."
				);
			}

			memes =
				data.data.memes;

			console.log(
				"Loaded memes:",
				memes.length
			);

		} catch (error) {

			console.error(error);

			setMainMenuStatus(
				"Failed to load memes."
			);
		}
	}


	// ============================================================
	// RANDOM MEME
	// ============================================================

	function getRandomMeme() {

		if (memes.length === 0) {
			return null;
		}

		const randomIndex =
			Math.floor(
				Math.random() *
				memes.length
			);

		return memes[randomIndex];
	}


	// ============================================================
	// CREATE ROOM CODE
	// ============================================================

	function generateRoomCode() {

		const characters =
			"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

		let code = "";

		for (let i = 0; i < 6; i++) {

			code +=
				characters[
					Math.floor(
						Math.random() *
						characters.length
					)
				];
		}

		return code;
	}


	// ============================================================
	// VALIDATE NAME
	// ============================================================

	function validateName() {

		const name =
			nameInput.value
				.trim()
				.slice(0, 20);

		if (name === "") {

			setMainMenuStatus(
				"Enter your name first."
			);

			return false;
		}

		myName = name;

		return true;
	}


	// ============================================================
	// HOST LOBBY
	// ============================================================

	async function hostLobby() {

		if (!validateName()) {
			return;
		}

		if (memes.length === 0) {

			setMainMenuStatus(
				"Memes are still loading..."
			);

			return;
		}

		hostLobbyButton.disabled = true;
		joinLobbyButton.disabled = true;

		setMainMenuStatus(
			"Creating lobby..."
		);

		isHost = true;

		tryHostRoom();

	}


	function tryHostRoom() {

		roomCodeValue =
			generateRoomCode();

		const peerId =
			ROOM_PREFIX +
			roomCodeValue.toLowerCase();

		peer =
			new Peer(peerId);


		peer.on(
			"open",
			function(id) {

				myPeerId = id;
				hostPeerId = id;

				participants = [
					{
						id: id,
						name: myName,
						isHost: true
					}
				];

				roomCode.innerText =
					roomCodeValue;

				updatePlayerList();

				lobbyStatus.innerText =
					"Waiting for players...";

				hostStartButton.disabled =
					false;

				showScreen(
					lobbyScreen
				);
			}
		);


		peer.on(
			"connection",
			function(connection) {

				if (!isHost) {
					return;
				}

				handleIncomingConnection(
					connection
				);
			}
		);


		peer.on(
			"error",
			function(error) {

				console.error(
					"Peer error:",
					error
				);

				if (
					error.type ===
					"unavailable-id"
				) {

					if (peer) {
						peer.destroy();
					}

					peer = null;

					setTimeout(
						tryHostRoom,
						100
					);

					return;
				}

				setMainMenuStatus(
					"Could not create the lobby."
				);

				hostLobbyButton.disabled =
					false;

				joinLobbyButton.disabled =
					false;
			}
		);
	}


	// ============================================================
	// HANDLE INCOMING HOST CONNECTION
	// ============================================================

	function handleIncomingConnection(
		connection
	) {

		connection.on(
			"open",
			function() {

				connections.set(
					connection.peer,
					connection
				);

				connection.on(
					"data",
					function(message) {

						handleHostMessage(
							connection,
							message
						);
					}
				);

				connection.on(
					"close",
					function() {

						removeParticipant(
							connection.peer
						);
					}
				);

				connection.on(
					"error",
					function(error) {

						console.error(
							error
						);
					}
				);

				sendMessage(
					connection,
					{
						type: "roomInfo",
						hostId: hostPeerId,
						players: participants,
						gameStarted:
							gameStarted
					}
				);
			}
		);
	}


	// ============================================================
	// HOST MESSAGE HANDLER
	// ============================================================

	function handleHostMessage(
		connection,
		message
	) {

		if (!message || !message.type) {
			return;
		}


		if (
			message.type ===
			"hello"
		) {

			if (gameStarted) {

				sendMessage(
					connection,
					{
						type: "reject",
						message:
							"The game has already started."
					}
				);

				connection.close();

				return;
			}


			if (
				participants.length >=
				MAX_PLAYERS
			) {

				sendMessage(
					connection,
					{
						type: "reject",
						message:
							"The lobby is full."
					}
				);

				connection.close();

				return;
			}


			const existing =
				participants.find(
					function(player) {
						return player.id ===
							connection.peer;
					}
				);


			if (!existing) {

				participants.push(
					{
						id:
							connection.peer,

						name:
							String(
								message.name ||
								"Player"
							)
								.slice(
									0,
									20
								),

						isHost: false
					}
				);
			}


			broadcastRoomState();

			return;
		}


		if (
			message.type ===
			"roundResult"
		) {

			if (!gameStarted) {
				return;
			}

			roundResults[
				connection.peer
			] = {
				name:
					getParticipantName(
						connection.peer
					),

				image:
					message.image
			};

			checkRoundResults();

			return;
		}


		if (
			message.type ===
			"vote"
		) {

			console.log(
				"Vote:",
				getParticipantName(
					connection.peer
				),
				message.index,
				message.vote
			);

			return;
		}
	}


	// ============================================================
	// JOIN LOBBY
	// ============================================================

	function joinLobby() {

		if (!validateName()) {
			return;
		}

		const code =
			joinCodeInput.value
				.trim()
				.toUpperCase();

		if (
			!/^[A-Z0-9]{6}$/.test(code)
		) {

			setMainMenuStatus(
				"Enter a valid 6-character room code."
			);

			return;
		}

		if (peer) {
			peer.destroy();
		}

		isHost = false;

		hostPeerId =
			ROOM_PREFIX +
			code.toLowerCase();

		roomCodeValue =
			code;

		setMainMenuStatus(
			"Joining lobby..."
		);

		hostLobbyButton.disabled = true;
		joinLobbyButton.disabled = true;

		peer =
			new Peer();


		peer.on(
			"open",
			function(id) {

				myPeerId = id;

				hostConnection =
					peer.connect(
						hostPeerId,
						{
							reliable: true
						}
					);

				setupHostConnection();
			}
		);


		peer.on(
			"error",
			function(error) {

				console.error(
					"Join error:",
					error
				);

				setMainMenuStatus(
					"Could not join that lobby."
				);

				hostLobbyButton.disabled =
					false;

				joinLobbyButton.disabled =
					false;
			}
		);
	}


	// ============================================================
	// SETUP GUEST CONNECTION
	// ============================================================

	function setupHostConnection() {

		hostConnection.on(
			"open",
			function() {

				sendMessage(
					hostConnection,
					{
						type: "hello",
						name: myName
					}
				);

				setMainMenuStatus(
					"Connected."
				);
			}
		);


		hostConnection.on(
			"data",
			function(message) {

				handleGuestMessage(
					message
				);
			}
		);


		hostConnection.on(
			"close",
			function() {

				handleHostDisconnected();
			}
		);


		hostConnection.on(
			"error",
			function(error) {

				console.error(
					error
				);
			}
		);
	}


	// ============================================================
	// GUEST MESSAGE HANDLER
	// ============================================================

	function handleGuestMessage(
		message
	) {

		if (!message || !message.type) {
			return;
		}


		if (
			message.type ===
			"roomInfo"
		) {

			participants =
				message.players || [];

			updatePlayerList();

			roomCode.innerText =
				roomCodeValue;

			hostStartButton.disabled =
				true;

			lobbyStatus.innerText =
				"Waiting for host...";

			showScreen(
				lobbyScreen
			);

			return;
		}


		if (
			message.type ===
			"roomState"
		) {

			participants =
				message.players || [];

			gameStarted =
				Boolean(
					message.gameStarted
				);

			updatePlayerList();

			if (!gameStarted) {

				lobbyStatus.innerText =
					"Waiting for host...";

				showScreen(
					lobbyScreen
				);
			}

			return;
		}


		if (
			message.type ===
			"gameStart"
		) {

			startRound(
				message.startAt
			);

			return;
		}


		if (
			message.type ===
			"showcase"
		) {

			startShowcase(
				message.items,
				message.startAt
			);

			return;
		}


		if (
			message.type ===
			"backToLobby"
		) {

			gameStarted = false;

			stopShowcaseTimer();

			showScreen(
				lobbyScreen
			);

			lobbyStatus.innerText =
				"Waiting for the next game...";

			return;
		}


		if (
			message.type ===
			"reject"
		) {

			alert(
				message.message ||
				"Could not join the lobby."
			);

			disconnectEverything();

			hostLobbyButton.disabled =
				false;

			joinLobbyButton.disabled =
				false;

			showScreen(
				mainMenu
			);

			return;
		}
	}


	// ============================================================
	// BROADCAST ROOM STATE
	// ============================================================

	function broadcastRoomState() {

		const message = {

			type: "roomState",

			players:
				participants,

			gameStarted:
				gameStarted
		};

		for (
			const connection of
			connections.values()
		) {

			if (
				connection.open
			) {

				sendMessage(
					connection,
					message
				);
			}
		}

		updatePlayerList();
	}


	// ============================================================
	// SEND TO EVERYONE
	// ============================================================

	function broadcast(
		message
	) {

		for (
			const connection of
			connections.values()
		) {

			if (
				connection.open
			) {

				sendMessage(
					connection,
					message
				);
			}
		}
	}


	// ============================================================
	// SAFE SEND
	// ============================================================

	function sendMessage(
		connection,
		message
	) {

		if (
			connection &&
			connection.open
		) {

			try {

				connection.send(
					message
				);

			} catch (error) {

				console.error(
					"Send error:",
					error
				);
			}
		}
	}


	// ============================================================
	// REMOVE PARTICIPANT
	// ============================================================

	function removeParticipant(
		peerId
	) {

		connections.delete(
			peerId
		);

		participants =
			participants.filter(
				function(player) {
					return player.id !==
						peerId;
				}
			);

		delete roundResults[
			peerId
		];

		updatePlayerList();

		if (
			isHost
		) {

			broadcastRoomState();

			if (gameStarted) {
				checkRoundResults();
			}
		}
	}


	// ============================================================
	// PARTICIPANT NAME
	// ============================================================

	function getParticipantName(
		peerId
	) {

		const player =
			participants.find(
				function(item) {
					return item.id ===
						peerId;
				}
			);

		if (player) {
			return player.name;
		}

		return "Player";
	}


	// ============================================================
	// PLAYER LIST
	// ============================================================

	function updatePlayerList() {

		playerList.innerHTML =
			"";

		for (
			const player of
			participants
		) {

			const entry =
				document.createElement(
					"div"
				);

			entry.className =
				"playerEntry";

			entry.innerText =
				player.name;

			if (player.isHost) {

				const hostTag =
					document.createElement(
						"span"
					);

				hostTag.className =
					"hostTag";

				hostTag.innerText =
					"HOST";

				entry.appendChild(
					hostTag
				);
			}

			if (
				player.id ===
				myPeerId
			) {

				const youTag =
					document.createElement(
						"span"
					);

				youTag.style.color =
					"#aaa";

				youTag.style.fontSize =
					"13px";

				youTag.style.marginLeft =
					"8px";

				youTag.innerText =
					"YOU";

				entry.appendChild(
					youTag
				);
			}

			playerList.appendChild(
				entry
			);
		}

		hostStartButton.disabled =
			!isHost ||
			participants.length < 1 ||
			gameStarted;
	}


	// ============================================================
	// START GAME
	// ============================================================

	function hostStartGame() {

		if (!isHost) {
			return;
		}

		if (gameStarted) {
			return;
		}

		if (memes.length === 0) {

			lobbyStatus.innerText =
				"Memes are still loading.";

			return;
		}

		gameStarted = true;

		roundResults = {};

		const startAt =
			Date.now() + 1500;

		participants.forEach(
			function(player) {
				roundResults[
					player.id
				] = null;
			}
		);

		broadcast(
			{
				type: "gameStart",
				startAt: startAt
			}
		);

		broadcastRoomState();

		startRound(
			startAt
		);
	}


	// ============================================================
	// START LOCAL ROUND
	// ============================================================

	function startRound(
		startAt
	) {

		roundStartTime =
			startAt;

		roundSubmitted =
			false;

		currentMeme =
			getRandomMeme();

		createControls();

		loadMemeImage();

		showScreen(
			editorScreen
		);

		startEditorTimer();
	}


	// ============================================================
	// EDITOR TIMER
	// ============================================================

	function startEditorTimer() {

		stopEditorTimer();

		updateEditorTimer();

		roundTimer =
			setInterval(
				updateEditorTimer,
				100
			);
	}


	function stopEditorTimer() {

		if (roundTimer) {

			clearInterval(
				roundTimer
			);

			roundTimer = null;
		}
	}


	function updateEditorTimer() {

		const remaining =
			Math.max(
				0,
				roundStartTime +
				ROUND_LENGTH -
				Date.now()
			);

		const seconds =
			Math.ceil(
				remaining / 1000
			);

		editorTimer.innerText =
			String(seconds);

		if (
			remaining <= 0 &&
			!roundSubmitted
		) {

			roundSubmitted =
				true;

			stopEditorTimer();

			editorMessage.innerText =
				"Time's up! Saving your meme...";

			submitRoundMeme();
		}
	}


	// ============================================================
	// SUBMIT LOCAL MEME
	// ============================================================

	function submitRoundMeme() {

		const image =
			createMemeDataURL();

		if (!image) {

			editorMessage.innerText =
				"Could not save your meme.";

			return;
		}

		editorMessage.innerText =
			"Your meme has been saved.";

		if (isHost) {

			roundResults[
				myPeerId
			] = {
				name: myName,
				image: image
			};

			checkRoundResults();

		} else {

			sendMessage(
				hostConnection,
				{
					type:
						"roundResult",

					image:
						image
				}
			);
		}
	}


	// ============================================================
	// CHECK WHETHER EVERYONE HAS SUBMITTED
	// ============================================================

	function checkRoundResults() {

		if (!isHost) {
			return;
		}

		const activeIds =
			participants.map(
				function(player) {
					return player.id;
				}
			);

		for (
			const id of
			activeIds
		) {

			if (
				!roundResults[id] ||
				!roundResults[id].image
			) {

				return;
			}
		}

		const items = [];

		for (
			const player of
			participants
		) {

			const result =
				roundResults[
					player.id
				];

			if (
				result &&
				result.image
			) {

				items.push(
					{
						peerId:
							player.id,

						name:
							player.name,

						image:
							result.image
					}
				);
			}
		}

		if (items.length === 0) {
			return;
		}

		const startAt =
			Date.now() + 1000;

		broadcast(
			{
				type:
					"showcase",

				items:
					items,

				startAt:
					startAt
			}
		);

		startShowcase(
			items,
			startAt
		);
	}


	// ============================================================
	// START SHOWCASE
	// ============================================================

	function startShowcase(
		items,
		startAt
	) {

		if (
			!items ||
			items.length === 0
		) {
			return;
		}

		showcaseItems =
			items;

		showcaseStartedAt =
			startAt;

		currentShowcaseIndex =
			-1;

		showScreen(
			showcaseScreen
		);

		startShowcaseTimer();
	}


	// ============================================================
	// SHOWCASE TIMER
	// ============================================================

	function startShowcaseTimer() {

		stopShowcaseTimer();

		updateShowcase();

		showcaseTimer =
			setInterval(
				updateShowcase,
				100
			);
	}


	function stopShowcaseTimer() {

		if (showcaseTimer) {

			clearInterval(
				showcaseTimer
			);

			showcaseTimer = null;
		}
	}


	function updateShowcase() {

		const elapsed =
			Math.max(
				0,
				Date.now() -
				showcaseStartedAt
			);

		const index =
			Math.floor(
				elapsed /
				SHOWCASE_LENGTH
			);

		if (
			index >=
			showcaseItems.length
		) {

			stopShowcaseTimer();

			finishShowcase();

			return;
		}

		if (
			index !==
			currentShowcaseIndex
		) {

			currentShowcaseIndex =
				index;

			showcaseImage.src =
				showcaseItems[
					index
				].image;

			showcaseStatus.innerText =
				"";

			clearVoteSelection();
		}
	}


	// ============================================================
	// VOTE
	// ============================================================

	function submitVote(
		vote
	) {

		if (
			currentShowcaseIndex < 0 ||
			currentShowcaseIndex >=
			showcaseItems.length
		) {
			return;
		}

		const buttons =
			document.querySelectorAll(
				".voteButton"
			);

		buttons.forEach(
			function(button) {

				button.classList.toggle(
					"selected",
					button.dataset.vote ===
					vote
				);
			}
		);


		const creatorPeerId =
			showcaseItems[
				currentShowcaseIndex
			].peerId;


		if (isHost) {

			console.log(
				"Vote:",
				myName,
				"for",
				creatorPeerId,
				vote
			);

		} else {

			sendMessage(
				hostConnection,
				{
					type:
						"vote",

					index:
						currentShowcaseIndex,

					vote:
						vote
				}
			);
		}
	}


	// ============================================================
	// CLEAR VOTE SELECTION
	// ============================================================

	function clearVoteSelection() {

		voteButtons.forEach(
			function(button) {

				button.classList.remove(
					"selected"
				);
			}
		);
	}


	// ============================================================
	// FINISH SHOWCASE
	// ============================================================

	function finishShowcase() {

		showcaseItems = [];
		currentShowcaseIndex = -1;

		if (isHost) {

			gameStarted = false;
			roundResults = {};

			broadcast(
				{
					type:
						"backToLobby"
				}
			);

			broadcastRoomState();

			showScreen(
				lobbyScreen
			);

			lobbyStatus.innerText =
				"Round finished! Ready for another game.";

		} else {

			gameStarted = false;

			showScreen(
				lobbyScreen
			);

			lobbyStatus.innerText =
				"Round finished! Waiting for the host...";
		}
	}


	// ============================================================
	// CHANGE LOCAL MEME
	// ============================================================

	changeMemeButton.addEventListener(
		"click",
		function() {

			if (roundSubmitted) {
				return;
			}

			currentMeme =
				getRandomMeme();

			createControls();

			loadMemeImage();
		}
	);


	// ============================================================
	// CREATE EDITOR CONTROLS
	// ============================================================

	function createControls() {

		controls.innerHTML =
			"";

		textBoxes = [];

		if (!currentMeme) {
			return;
		}

		const boxCount =
			currentMeme.box_count || 2;


		for (
			let i = 0;
			i < boxCount;
			i++
		) {

			const box = {

				text: "",

				x: 50,

				y: 50,

				size: 8,

				index: i
			};


			if (
				boxCount === 2
			) {

				if (i === 0) {
					box.y = 10;
				} else {
					box.y = 90;
				}

			} else {

				box.y =
					10 +
					(
						80 /
						Math.max(
							1,
							boxCount - 1
						)
					) *
					i;
			}


			textBoxes.push(
				box
			);

			createTextBoxControls(
				box
			);
		}
	}


	// ============================================================
	// CREATE TEXT BOX CONTROLS
	// ============================================================

	function createTextBoxControls(
		box
	) {

		const container =
			document.createElement(
				"div"
			);

		container.className =
			"textBoxControls";


		const title =
			document.createElement(
				"h3"
			);

		title.innerText =
			"Text Box " +
			(box.index + 1);

		container.appendChild(
			title
		);


		// TEXT

		const textLabel =
			document.createElement(
				"label"
			);

		textLabel.innerText =
			"Text";

		container.appendChild(
			textLabel
		);


		const textInput =
			document.createElement(
				"input"
			);

		textInput.type =
			"text";

		textInput.placeholder =
			getPlaceholder(
				box.index,
				currentMeme.box_count
			);

		textInput.value =
			box.text;


		textInput.addEventListener(
			"input",
			function() {

				if (roundSubmitted) {
					return;
				}

				box.text =
					textInput.value;

				drawMeme();
			}
		);


		container.appendChild(
			textInput
		);


		// X

		const xLabel =
			document.createElement(
				"label"
			);

		xLabel.innerText =
			"X Position (%)";

		container.appendChild(
			xLabel
		);


		const xInput =
			document.createElement(
				"input"
			);

		xInput.type =
			"number";

		xInput.className =
			"numberInput";

		xInput.min = 0;

		xInput.max = 100;

		xInput.step = 0.1;

		xInput.value =
			box.x;


		xInput.addEventListener(
			"input",
			function() {

				if (roundSubmitted) {
					return;
				}

				box.x =
					clamp(
						parseFloat(
							xInput.value
						) || 0,
						0,
						100
					);

				drawMeme();
			}
		);


		container.appendChild(
			xInput
		);


		// Y

		const yLabel =
			document.createElement(
				"label"
			);

		yLabel.innerText =
			"Y Position (%)";

		container.appendChild(
			yLabel
		);


		const yInput =
			document.createElement(
				"input"
			);

		yInput.type =
			"number";

		yInput.className =
			"numberInput";

		yInput.min = 0;

		yInput.max = 100;

		yInput.step = 0.1;

		yInput.value =
			box.y;


		yInput.addEventListener(
			"input",
			function() {

				if (roundSubmitted) {
					return;
				}

				box.y =
					clamp(
						parseFloat(
							yInput.value
						) || 0,
						0,
						100
					);

				drawMeme();
			}
		);


		container.appendChild(
			yInput
		);


		// FONT SIZE

		const sizeLabel =
			document.createElement(
				"label"
			);

		sizeLabel.innerText =
			"Font Size (%)";

		container.appendChild(
			sizeLabel
		);


		const sizeInput =
			document.createElement(
				"input"
			);

		sizeInput.type =
			"number";

		sizeInput.className =
			"numberInput";

		sizeInput.min = 1;

		sizeInput.max = 30;

		sizeInput.step = 1;

		sizeInput.value =
			box.size;


		sizeInput.addEventListener(
			"input",
			function() {

				if (roundSubmitted) {
					return;
				}

				box.size =
					clamp(
						Math.round(
							parseFloat(
								sizeInput.value
							) || 1
						),
						1,
						30
					);

				sizeInput.value =
					box.size;

				drawMeme();
			}
		);


		container.appendChild(
			sizeInput
		);


		// RESET

		const resetButton =
			document.createElement(
				"button"
			);

		resetButton.className =
			"resetButton";

		resetButton.innerText =
			"Reset Position";


		resetButton.addEventListener(
			"click",
			function() {

				if (roundSubmitted) {
					return;
				}

				box.x =
					50;

				if (
					currentMeme.box_count ===
					2
				) {

					box.y =
						box.index === 0
							? 10
							: 90;

				} else {

					box.y =
						10 +
						(
							80 /
							Math.max(
								1,
								currentMeme.box_count - 1
							)
						) *
						box.index;
				}


				xInput.value =
					box.x;

				yInput.value =
					box.y;

				drawMeme();
			}
		);


		container.appendChild(
			resetButton
		);

		controls.appendChild(
			container
		);


		box.xInput =
			xInput;

		box.yInput =
			yInput;

		box.sizeInput =
			sizeInput;
	}


	// ============================================================
	// PLACEHOLDER
	// ============================================================

	function getPlaceholder(
		index,
		boxCount
	) {

		if (boxCount === 1) {
			return "Meme text...";
		}

		if (index === 0) {
			return "Top text...";
		}

		if (index === 1) {
			return "Bottom text...";
		}

		return "Text " +
			(index + 1) +
			"...";
	}


	// ============================================================
	// LOAD IMAGE
	// ============================================================

	function loadMemeImage() {

		if (!currentMeme) {
			return;
		}

		const token =
			++imageLoadToken;

		currentImage =
			new Image();

		currentImage.crossOrigin =
			"anonymous";

		editorMemeName.innerText =
			currentMeme.name;


		currentImage.onload =
			function() {

				if (
					token !==
					imageLoadToken
				) {
					return;
				}

				memeCanvas.width =
					currentImage.naturalWidth;

				memeCanvas.height =
					currentImage.naturalHeight;

				drawMeme();
			};


		currentImage.onerror =
			function() {

				console.error(
					"Failed to load meme image."
				);
			};


		currentImage.src =
			currentMeme.url;
	}


	// ============================================================
	// DRAW MEME
	// ============================================================

	function drawMeme() {

		if (
			!currentImage ||
			!currentImage.complete
		) {
			return;
		}


		ctx.clearRect(
			0,
			0,
			memeCanvas.width,
			memeCanvas.height
		);


		ctx.drawImage(
			currentImage,
			0,
			0,
			memeCanvas.width,
			memeCanvas.height
		);


		for (
			const box of
			textBoxes
		) {

			if (
				box.text.trim() === ""
			) {
				continue;
			}


			const x =
				memeCanvas.width *
				(box.x / 100);

			const y =
				memeCanvas.height *
				(box.y / 100);

			const fontSize =
				memeCanvas.width *
				(box.size / 100);


			setupTextStyle(
				ctx,
				fontSize
			);


			drawText(
				ctx,
				box.text,
				x,
				y,
				fontSize,
				memeCanvas.width
			);
		}


		if (!roundSubmitted) {
			drawTextHandles();
		}
	}


	// ============================================================
	// TEXT STYLE
	// ============================================================

	function setupTextStyle(
		drawCtx,
		fontSize
	) {

		drawCtx.font =
			"bold " +
			fontSize +
			"px Impact, Arial Black, sans-serif";

		drawCtx.textAlign =
			"center";

		drawCtx.textBaseline =
			"middle";

		drawCtx.fillStyle =
			"white";

		drawCtx.strokeStyle =
			"black";

		drawCtx.lineWidth =
			Math.max(
				5,
				fontSize * 0.16
			);

		drawCtx.lineJoin =
			"round";
	}


	// ============================================================
	// DRAW TEXT
	// ============================================================

	function drawText(
		drawCtx,
		text,
		x,
		y,
		fontSize,
		canvasWidth
	) {

		const maxWidth =
			canvasWidth * 0.9;

		const lines =
			wrapText(
				drawCtx,
				text,
				maxWidth,
				fontSize
			);

		const lineHeight =
			fontSize * 1.05;

		const totalHeight =
			lines.length *
			lineHeight;

		let startY =
			y -
			totalHeight / 2 +
			lineHeight / 2;


		for (
			const line of
			lines
		) {

			drawSpacedText(
				drawCtx,
				line,
				x,
				startY,
				fontSize
			);

			startY +=
				lineHeight;
		}
	}


	// ============================================================
	// DRAW SPACED TEXT
	// ============================================================

	function drawSpacedText(
		drawCtx,
		text,
		x,
		y,
		fontSize
	) {

		const letterSpacing =
			fontSize * 0.055;

		const characters =
			Array.from(text);

		if (
			characters.length === 0
		) {
			return;
		}


		let totalWidth = 0;


		for (
			const character of
			characters
		) {

			totalWidth +=
				drawCtx.measureText(
					character
				).width;
		}


		totalWidth +=
			letterSpacing *
			(characters.length - 1);


		let currentX =
			x -
			totalWidth / 2;


		for (
			const character of
			characters
		) {

			const characterWidth =
				drawCtx.measureText(
					character
				).width;

			const characterX =
				currentX +
				characterWidth / 2;


			drawCtx.strokeText(
				character,
				characterX,
				y
			);

			drawCtx.fillText(
				character,
				characterX,
				y
			);


			currentX +=
				characterWidth +
				letterSpacing;
		}
	}


	// ============================================================
	// WRAP TEXT
	// ============================================================

	function wrapText(
		drawCtx,
		text,
		maxWidth,
		fontSize
	) {

		const words =
			text.split(" ");

		const lines = [];

		let currentLine =
			"";


		for (
			const word of
			words
		) {

			const testLine =
				currentLine === ""
					? word
					: currentLine +
						" " +
						word;


			const width =
				getSpacedTextWidth(
					drawCtx,
					testLine,
					fontSize
				);


			if (
				width > maxWidth &&
				currentLine !== ""
			) {

				lines.push(
					currentLine
				);

				currentLine =
					word;

			} else {

				currentLine =
					testLine;
			}
		}


		if (
			currentLine !== ""
		) {

			lines.push(
				currentLine
			);
		}


		return lines;
	}


	// ============================================================
	// SPACED TEXT WIDTH
	// ============================================================

	function getSpacedTextWidth(
		drawCtx,
		text,
		fontSize
	) {

		const letterSpacing =
			fontSize * 0.035;

		const characters =
			Array.from(text);

		let width = 0;


		for (
			const character of
			characters
		) {

			width +=
				drawCtx.measureText(
					character
				).width;
		}


		if (
			characters.length > 1
		) {

			width +=
				letterSpacing *
				(characters.length - 1);
		}


		return width;
	}


	// ============================================================
	// DRAW HANDLES
	// ============================================================

	function drawTextHandles() {

		for (
			const box of
			textBoxes
		) {

			if (
				box.text.trim() === ""
			) {
				continue;
			}


			const x =
				memeCanvas.width *
				(box.x / 100);

			const y =
				memeCanvas.height *
				(box.y / 100);

			const fontSize =
				memeCanvas.width *
				(box.size / 100);


			setupTextStyle(
				ctx,
				fontSize
			);


			const textWidth =
				Math.min(
					getSpacedTextWidth(
						ctx,
						box.text,
						fontSize
					),
					memeCanvas.width *
					0.9
				);


			const handleWidth =
				Math.max(
					60,
					textWidth + 20
				);

			const handleHeight =
				fontSize + 20;


			ctx.strokeStyle =
				"rgba(255,255,255,0.6)";

			ctx.lineWidth =
				2;

			ctx.setLineDash(
				[
					6,
					4
				]
			);


			ctx.strokeRect(
				x -
					handleWidth / 2,
				y -
					handleHeight / 2,
				handleWidth,
				handleHeight
			);


			ctx.setLineDash(
				[]
			);
		}
	}


	// ============================================================
	// FIND BOX UNDER POSITION
	// ============================================================

	function getBoxAtPosition(
		mouseX,
		mouseY
	) {

		for (
			let i =
				textBoxes.length - 1;
			i >= 0;
			i--
		) {

			const box =
				textBoxes[i];


			if (
				box.text.trim() === ""
			) {
				continue;
			}


			const x =
				memeCanvas.width *
				(box.x / 100);

			const y =
				memeCanvas.height *
				(box.y / 100);

			const fontSize =
				memeCanvas.width *
				(box.size / 100);


			setupTextStyle(
				ctx,
				fontSize
			);


			const textWidth =
				Math.min(
					getSpacedTextWidth(
						ctx,
						box.text,
						fontSize
					),
					memeCanvas.width *
					0.9
				);


			const boxWidth =
				Math.max(
					60,
					textWidth + 30
				);

			const boxHeight =
				fontSize + 30;


			if (
				mouseX >=
					x -
					boxWidth / 2 &&
				mouseX <=
					x +
					boxWidth / 2 &&
				mouseY >=
					y -
					boxHeight / 2 &&
				mouseY <=
					y +
					boxHeight / 2
			) {

				return box;
			}
		}


		return null;
	}


	// ============================================================
	// MOUSE DOWN
	// ============================================================

	memeCanvas.addEventListener(
		"mousedown",
		function(event) {

			if (roundSubmitted) {
				return;
			}


			const position =
				getMousePosition(
					event
				);


			const box =
				getBoxAtPosition(
					position.x,
					position.y
				);


			if (!box) {
				return;
			}


			draggingBox =
				box;


			dragOffsetX =
				position.x -
				memeCanvas.width *
				(box.x / 100);


			dragOffsetY =
				position.y -
				memeCanvas.height *
				(box.y / 100);
		}
	);


	// ============================================================
	// MOUSE MOVE
	// ============================================================

	memeCanvas.addEventListener(
		"mousemove",
		function(event) {

			if (
				!draggingBox ||
				roundSubmitted
			) {
				return;
			}


			const position =
				getMousePosition(
					event
				);


			const newX =
				position.x -
				dragOffsetX;

			const newY =
				position.y -
				dragOffsetY;


			draggingBox.x =
				clamp(
					newX /
						memeCanvas.width *
						100,
					0,
					100
				);


			draggingBox.y =
				clamp(
					newY /
						memeCanvas.height *
						100,
					0,
					100
				);


			draggingBox.xInput.value =
				draggingBox.x.toFixed(
					1
				);

			draggingBox.yInput.value =
				draggingBox.y.toFixed(
					1
				);


			drawMeme();
		}
	);


	// ============================================================
	// MOUSE UP
	// ============================================================

	document.addEventListener(
		"mouseup",
		function() {

			draggingBox =
				null;
		}
	);


	// ============================================================
	// TOUCH START
	// ============================================================

	memeCanvas.addEventListener(
		"touchstart",
		function(event) {

			if (roundSubmitted) {
				return;
			}


			event.preventDefault();


			const touch =
				event.touches[0];


			const position =
				getTouchPosition(
					touch
				);


			const box =
				getBoxAtPosition(
					position.x,
					position.y
				);


			if (!box) {
				return;
			}


			draggingBox =
				box;


			dragOffsetX =
				position.x -
				memeCanvas.width *
				(box.x / 100);


			dragOffsetY =
				position.y -
				memeCanvas.height *
				(box.y / 100);
		},
		{
			passive: false
		}
	);


	// ============================================================
	// TOUCH MOVE
	// ============================================================

	memeCanvas.addEventListener(
		"touchmove",
		function(event) {

			if (
				!draggingBox ||
				roundSubmitted
			) {
				return;
			}


			event.preventDefault();


			const touch =
				event.touches[0];


			const position =
				getTouchPosition(
					touch
				);


			const newX =
				position.x -
				dragOffsetX;

			const newY =
				position.y -
				dragOffsetY;


			draggingBox.x =
				clamp(
					newX /
						memeCanvas.width *
						100,
					0,
					100
				);


			draggingBox.y =
				clamp(
					newY /
						memeCanvas.height *
						100,
					0,
					100
				);


			draggingBox.xInput.value =
				draggingBox.x.toFixed(
					1
				);

			draggingBox.yInput.value =
				draggingBox.y.toFixed(
					1
				);


			drawMeme();
		},
		{
			passive: false
		}
	);


	// ============================================================
	// TOUCH END
	// ============================================================

	memeCanvas.addEventListener(
		"touchend",
		function() {

			draggingBox =
				null;
		}
	);


	// ============================================================
	// MOUSE POSITION
	// ============================================================

	function getMousePosition(
		event
	) {

		const rect =
			memeCanvas.getBoundingClientRect();


		const scaleX =
			memeCanvas.width /
			rect.width;

		const scaleY =
			memeCanvas.height /
			rect.height;


		return {

			x:
				(event.clientX -
					rect.left) *
				scaleX,

			y:
				(event.clientY -
					rect.top) *
				scaleY
		};
	}


	// ============================================================
	// TOUCH POSITION
	// ============================================================

	function getTouchPosition(
		touch
	) {

		const rect =
			memeCanvas.getBoundingClientRect();


		const scaleX =
			memeCanvas.width /
			rect.width;

		const scaleY =
			memeCanvas.height /
			rect.height;


		return {

			x:
				(touch.clientX -
					rect.left) *
				scaleX,

			y:
				(touch.clientY -
					rect.top) *
				scaleY
		};
	}


	// ============================================================
	// CREATE FINAL MEME IMAGE
	// ============================================================

	function createMemeDataURL() {

		if (
			!currentImage ||
			!currentImage.complete
		) {

			return null;
		}


		const exportCanvas =
			document.createElement(
				"canvas"
			);

		exportCanvas.width =
			memeCanvas.width;

		exportCanvas.height =
			memeCanvas.height;


		const exportCtx =
			exportCanvas.getContext(
				"2d"
			);


		exportCtx.drawImage(
			currentImage,
			0,
			0,
			exportCanvas.width,
			exportCanvas.height
		);


		for (
			const box of
			textBoxes
		) {

			if (
				box.text.trim() === ""
			) {
				continue;
			}


			const x =
				exportCanvas.width *
				(box.x / 100);

			const y =
				exportCanvas.height *
				(box.y / 100);

			const fontSize =
				exportCanvas.width *
				(box.size / 100);


			setupTextStyle(
				exportCtx,
				fontSize
			);


			drawText(
				exportCtx,
				box.text,
				x,
				y,
				fontSize,
				exportCanvas.width
			);
		}


		try {

			return exportCanvas.toDataURL(
				"image/png"
			);

		} catch (error) {

			console.error(
				"Could not export meme:",
				error
			);

			return null;
		}
	}


	// ============================================================
	// CLAMP
	// ============================================================

	function clamp(
		value,
		min,
		max
	) {

		return Math.min(
			Math.max(
				value,
				min
			),
			max
		);
	}


	// ============================================================
	// LEAVE LOBBY
	// ============================================================

	function leaveLobby() {

		disconnectEverything();

		isHost = false;
		gameStarted = false;

		participants = [];

		roundResults = {};

		hostConnection = null;
		hostPeerId = null;
		roomCodeValue = "";

		hostLobbyButton.disabled =
			false;

		joinLobbyButton.disabled =
			false;

		setMainMenuStatus(
			""
		);

		showScreen(
			mainMenu
		);
	}


	// ============================================================
	// HOST DISCONNECTED
	// ============================================================

	function handleHostDisconnected() {

		if (isHost) {
			return;
		}

		stopEditorTimer();
		stopShowcaseTimer();

		gameStarted =
			false;

		alert(
			"The host left the lobby."
		);

		disconnectEverything();

		hostLobbyButton.disabled =
			false;

		joinLobbyButton.disabled =
			false;

		showScreen(
			mainMenu
		);
	}


	// ============================================================
	// DISCONNECT EVERYTHING
	// ============================================================

	function disconnectEverything() {

		stopEditorTimer();
		stopShowcaseTimer();

		if (hostConnection) {

			try {
				hostConnection.close();
			} catch (error) {
			}

			hostConnection =
				null;
		}


		for (
			const connection of
			connections.values()
		) {

			try {
				connection.close();
			} catch (error) {
			}
		}


		connections.clear();


		if (peer) {

			try {
				peer.destroy();
			} catch (error) {
			}

			peer = null;
		}
	}


	// ============================================================
	// BUTTONS
	// ============================================================

	hostLobbyButton.addEventListener(
		"click",
		hostLobby
	);

	joinLobbyButton.addEventListener(
		"click",
		joinLobby
	);

	hostStartButton.addEventListener(
		"click",
		hostStartGame
	);

	leaveLobbyButton.addEventListener(
		"click",
		leaveLobby
	);


	voteButtons.forEach(
		function(button) {

			button.addEventListener(
				"click",
				function() {

					submitVote(
						button.dataset.vote
					);
				}
			);
		}
	);


	joinCodeInput.addEventListener(
		"input",
		function() {

			joinCodeInput.value =
				joinCodeInput.value
					.toUpperCase()
					.replace(
						/[^A-Z0-9]/g,
						""
					);
		}
	);


	nameInput.addEventListener(
		"keydown",
		function(event) {

			if (
				event.key ===
				"Enter"
			) {

				hostLobby();
			}
		}
	);


	joinCodeInput.addEventListener(
		"keydown",
		function(event) {

			if (
				event.key ===
				"Enter"
			) {

				joinLobby();
			}
		}
	);


	// ============================================================
	// START
	// ============================================================

	loadMemes();

</script>
